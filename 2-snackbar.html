<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snackbar</title>

  <script type="module" crossorigin src="/goit-js-hw-10/assets/styles-DgaPeT-d.js"></script>
  <script type="module" crossorigin src="/goit-js-hw-10/assets/vendor-BbSUbo7J.js"></script>

  <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-DjRFJe6o.css">

<body class="snackbar-body">

  <h2>Delay (ms)</h2>

  <form class="form">
    <label class="form-label">
      <input
        class="form-input"
        type="number"
        name="delay"
        required
      />
    </label>

    <fieldset class="form-fieldset">
      <legend class="form-legend">State</legend>

      <label class="radio-label">
        <input type="radio" name="state" value="fulfilled" required />
        Fulfilled
      </label>

      <label class="radio-label">
        <input type="radio" name="state" value="rejected" required />
        Rejected
      </label>
    </fieldset>

    <button type="submit" class="button-snackbar">
      Create notification
    </button>
  </form>

</body>
</html>
