<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css" />
  <script type="module" crossorigin src="/goit-js-hw-10/assets/styles-7xlPJwy_.js"></script>
  <script type="module" crossorigin src="/goit-js-hw-10/assets/vendor-BbSUbo7J.js"></script>
  <script type="module" crossorigin src="/goit-js-hw-10/assets/1-timer-B88N3HDt.js"></script>
  <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/styles-oemZr28P.css">
  <link rel="stylesheet" crossorigin href="/goit-js-hw-10/assets/vendor-C1gPI-5C.css">
</head>

<body>
  <h1></h1>
  <div class="timer-body">
  <h1 class="timer-title"></h1>

  <div class="timer-controls">
    <input
      type="text"
      id="datetime-picker"
      class="datetime-picker"
      placeholder="Select date and time"
    />

    <button type="button" class="timer-button" data-start disabled>
      Start
    </button>
  </div>

  <div class="timer">
    <div class="time-block">
      <span class="time-value" data-days>00</span>
      <span class="time-label">Days</span>
    </div>
    <div class="time-block">
      <span class="time-value" data-hours>00</span>
      <span class="time-label">Hours</span>
    </div>
    <div class="time-block">
      <span class="time-value" data-minutes>00</span>
      <span class="time-label">Minutes</span>
    </div>
    <div class="time-block">
      <span class="time-value" data-seconds>00</span>
      <span class="time-label">Seconds</span>
    </div>
  </div>
</div>


  

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
</body>
</html>
